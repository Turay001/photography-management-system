<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found | Critical Shot</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .nf { min-height: 100vh; display: grid; place-items: center; text-align: center;
          background: #05070d; color: #fff; padding: 2rem; }
    .nf-code { font-size: clamp(4rem, 14vw, 8rem); font-weight: 800; letter-spacing: -.04em;
               background: linear-gradient(120deg, #6366f1, #22d3ee);
               -webkit-background-clip: text; background-clip: text; color: transparent; }
    .nf p { color: rgba(255,255,255,.6); max-width: 34rem; margin: .75rem auto 1.75rem; line-height: 1.7; }
    .nf a { display: inline-flex; align-items: center; gap: .5rem; background: #4f46e5; color: #fff;
            padding: .75rem 1.5rem; border-radius: .75rem; text-decoration: none; font-weight: 600; }
    .nf a:hover { background: #4338ca; }
    .nf small { display: block; margin-top: 1.5rem; color: rgba(255,255,255,.35); }
  </style>
</head>
<body>
  <main class="nf">
    <div>
      <div class="nf-code">404</div>
      <h1>Page not found</h1>
      <p>You followed a link that doesn't exist on this site — it may have been
         renamed or the address was mistyped.</p>
      <a href="index.html">Back to the homepage</a>
      <small>Critical Shot — photography booking &amp; client management</small>
    </div>
  </main>
</body>
</html>

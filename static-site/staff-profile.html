<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Staff Profile | Critical Shot</title>
  <link rel="icon" type="image/svg+xml" href="images/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="light">

  <header id="site-header"></header>

  <main class="app-page">
    <div class="page-hero" style="padding-top:2rem">
      <div class="flex align-center justify-between" style="flex-wrap:wrap;gap:.75rem">
        <div>
          <p class="text-gray" style="margin:0 0 .25rem" id="sp-date"></p>
          <h1 class="heading-xl" id="sp-welcome" style="margin:0">Welcome</h1>
        </div>
        <div class="flex align-center" style="gap:.5rem">
          <a href="#" class="btn btn-outline btn-sm" id="sp-back" style="display:none">&#8592; Back</a>
          <button class="btn btn-indigo btn-sm" id="sp-editbtn">Edit Profile</button>
        </div>
      </div>
    </div>

    <div class="page-body" style="max-width:44rem">
      <div id="sp-mount">
        <div class="loading-block"><span class="spinner spinner-dark"></span> Loading profile...</div>
      </div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <script src="js/core.js"></script>
  <script src="js/pages/staff-profile.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Album | Critical Shot</title>
  <link rel="icon" type="image/svg+xml" href="images/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="light">

  <header id="site-header"></header>

  <main class="app-page bg-amber-grad">
    <div id="album-hero" style="position:relative;min-height:46vh;background:#111827;background-size:cover;background-position:center;display:flex;align-items:flex-end">
      <div style="position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.35),rgba(0,0,0,.78))"></div>
      <div class="page-hero" style="position:relative;z-index:1">
        <a href="albums-user.html" style="display:inline-block;margin-bottom:1rem;color:#fbbf24;font-size:.9rem;font-weight:600">&#8592; Back to Albums</a>
        <h1 class="serif" id="au-name" style="font-size:2.5rem;font-weight:700;color:#fff;margin:0">...</h1>
      </div>
    </div>

    <div class="page-body" style="max-width:76rem">
      <div class="flex align-center justify-between" style="gap:1rem;flex-wrap:wrap;margin-bottom:1.25rem">
        <div id="au-meta" class="flex align-center" style="gap:.75rem;flex-wrap:wrap"></div>
      </div>
      <div id="au-desc"></div>
      <h2 style="font-family:Space Grotesk,Inter,sans-serif;font-size:1.5rem;font-weight:700;color:#1f2937;margin:1.75rem 0 1rem">Gallery</h2>
      <div id="au-gallery" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.85rem"></div>
    </div>
  </main>

  <footer id="site-footer"></footer>

  <div id="lightbox" style="display:none;position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.94);align-items:center;justify-content:center">
    <button id="lb-close" style="position:absolute;top:1.25rem;right:1.5rem;background:none;border:0;color:#fff;font-size:2rem;cursor:pointer;line-height:1" aria-label="Close">&#10005;</button>
    <button id="lb-prev" style="position:absolute;left:1rem;top:50%;transform:translateY(-50%);background:#fff;border:0;border-radius:9999px;width:3rem;height:3rem;font-size:1.4rem;cursor:pointer" aria-label="Previous">&#8249;</button>
    <button id="lb-next" style="position:absolute;right:1rem;top:50%;transform:translateY(-50%);background:#fff;border:0;border-radius:9999px;width:3rem;height:3rem;font-size:1.4rem;cursor:pointer" aria-label="Next">&#8250;</button>
    <div style="max-width:88vw;max-height:82vh;text-align:center">
      <img id="lb-img" src="" alt="Photo" style="max-width:88vw;max-height:78vh;object-fit:contain;border-radius:.25rem">
      <p id="lb-count" style="color:#9ca3af;margin-top:.75rem;font-size:.9rem">1 of 1</p>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/pages/albums-view.js"></script>
</body>
</html>

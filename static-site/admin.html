<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Dashboard | Critical Shot</title>
  <link rel="icon" type="image/svg+xml" href="images/icon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body class="light">

  <div id="admin-shell">
    <div id="real-content">
      <div id="dash-content">
        <div class="flex align-center justify-between" style="flex-wrap:wrap;gap:1rem">
          <div>
            <h1 class="heading-xl">Dashboard</h1>
            <p class="text-gray" style="margin-top:.25rem">Overview of your studio.</p>
          </div>
          <button class="btn btn-indigo" id="dash-new-booking">+ New Booking</button>
        </div>

        <div class="stat-grid" id="dash-stats"></div>

        <div style="margin-top:2.5rem">
          <h2 class="heading-lg">Recent Activity</h2>
          <div class="card" style="margin-top:1rem;padding:1.5rem">
            <div id="dash-activity"><div class="loading-block"><span class="spinner spinner-dark"></span> Loading activity...</div></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/core.js"></script>
  <script src="js/pages/admin.js"></script>
</body>
</html>
